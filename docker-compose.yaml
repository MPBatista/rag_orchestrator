# ---------------------------------------------------------
# Include the model
# ---------------------------------------------------------
include:
  - ../docker-compose.yaml  #with vllm-qwen2-awq- declared

services:
  # ---------------------------------------------------------
  # ChromaDB — persistent vector database
  # ---------------------------------------------------------
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chromadb_container
    restart: unless-stopped
    networks:
      - rag_net
    ports:
      - "8000:8000"
    volumes:
      - /media/ia/chromadb-llama-cpp-rag:/chroma
    environment:
      - CHROMA_DB_IMPL=duckdb+parquet
      - CHROMA_PERSIST_DIRECTORY=/chroma

  # ---------------------------------------------------------
  # RAG orchestrator — your Python app
  # ---------------------------------------------------------
  rag_orchestrator:
    build: .
#    build:
#      context: ./rag_orchestrator
#      context: .
#      dockerfile: Dockerfile
    container_name: rag_orchestrator_container
    restart: unless-stopped
    networks:
      - rag_net
    ports:
      - "9000:9000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLAMA_SERVER_URL=http://vllm_qwen2:8080
      - CHROMADB_URL=http://chromadb:8000
    depends_on:
#      - llama_cpp
      - chromadb
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - /media/ia/documents:/documents
#    command: ["uvicorn", "rag_orchestrator:app", "--host", "0.0.0.0", "--port", "9000"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9000"]

networks:
  rag_net:
    driver: bridge

